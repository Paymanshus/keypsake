name: windows

on:
  push:
    branches: [main]
    paths: ["rust/**", "Resources/Fonts/**", "Resources/Info.plist", "scripts/check-versions.sh", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["rust/**", "Resources/Fonts/**", "Resources/Info.plist", "scripts/check-versions.sh", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: ../scripts/check-versions.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy -p keypsake-core --all-targets -- -D warnings
      - run: cargo test -p keypsake-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json
      - run: npm ci && npm run build
        working-directory: rust/app

  app:
    name: app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json
      - run: npm ci && npm run build
        working-directory: rust/app
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npx tauri build
        working-directory: rust/app
      - uses: actions/upload-artifact@v4
        with:
          name: keypsake-windows-installer
          path: rust/target/release/bundle/nsis/*.exe
          if-no-files-found: error
