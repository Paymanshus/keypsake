[workspace]
resolver = "2"
members = ["crates/core", "crates/platform-windows", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
keypsake-core = { path = "crates/core" }
keypsake-platform-windows = { path = "crates/platform-windows" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
